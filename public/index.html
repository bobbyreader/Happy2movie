<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <!-- iOS Safari 固定到主屏幕 (PWA / Standalone) 专项优化 -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Happy2movie">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="apple-touch-icon" href="/favicon.svg">
  <title>Happy2movie - 聚合影视播放</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="/style.css">
  <!-- 本地优先，无网络/CDN限制 -->
  <script src="/vendor/hls.min.js"></script>
  <script src="/vendor/artplayer.js"></script>
  <script>
    if (!window.Hls) {
      document.write('<script src="https://cdn.jsdelivr.net/npm/hls.js@latest/dist/hls.min.js"><\/script>');
    }
    if (!window.Artplayer) {
      document.write('<script src="https://cdn.jsdelivr.net/npm/artplayer/dist/artplayer.js"><\/script>');
    }
  </script>
</head>
<body>
  <!-- 顶栏导航 -->
  <header class="app-header">
    <div class="header-inner">
      <div class="brand" id="brandBtn">
        <span class="brand-icon">🎬</span>
        <span class="brand-title">Happy2<span class="highlight">movie</span></span>
        <span class="badge-demo">Demo</span>
      </div>

      <div class="search-box-wrapper">
        <div class="search-input-group">
          <input 
            type="text" 
            id="searchInput" 
            placeholder="搜索电影、剧集、动漫、综艺（如：繁花、庆余年、狂飙）..." 
            autocomplete="off"
          />
          <button id="clearBtn" class="clear-btn" style="display: none;">✕</button>
          <button id="searchBtn" class="search-btn">
            <span class="search-icon">🔍</span>
            <span>聚合搜</span>
          </button>
        </div>
      </div>

      <div class="header-actions">
        <button id="historyToggleBtn" class="action-btn" title="播放历史">
          🕒 历史 <span id="historyBadge" class="action-badge" style="display:none;">0</span>
        </button>
      </div>
    </div>

    <!-- 热搜推荐标签 -->
    <div class="hot-tags-row">
      <span class="hot-label">🔥 热门搜索：</span>
      <div class="hot-tags" id="hotTags">
        <button class="tag-chip" data-kw="狂飙">狂飙</button>
        <button class="tag-chip" data-kw="庆余年">庆余年</button>
        <button class="tag-chip" data-kw="繁花">繁花</button>
        <button class="tag-chip" data-kw="三体">三体</button>
        <button class="tag-chip" data-kw="漫长的季节">漫长的季节</button>
        <button class="tag-chip" data-kw="间谍过家家">间谍过家家</button>
        <button class="tag-chip" data-kw="封神">封神</button>
      </div>
    </div>
  </header>

  <!-- 搜索状态与源耗时条 -->
  <div class="stats-bar" id="statsBar" style="display: none;">
    <div class="stats-content">
      <span id="statsSummary" class="stats-text"></span>
      <div class="source-pills" id="sourcePills"></div>
    </div>
  </div>

  <!-- 主体展示区 -->
  <main class="main-container">
    <!-- 播放器专区 -->
    <section class="player-section" id="playerSection" style="display: none;">
      <div class="player-wrapper">
        <div class="player-header">
          <button id="backBtn" class="back-btn">← 返回列表</button>
          <div class="player-header-title-wrap">
            <h2 id="nowPlayingTitle" class="now-playing-title">正在播放</h2>
            <span id="nowPlayingEp" class="now-playing-ep"></span>
          </div>
          <div class="player-header-right">
            <button id="fullscreenBtn" class="action-control-btn" title="点击进入全屏播放">
              ⛶ 全屏
            </button>
            <button id="pipBtn" class="action-control-btn pip-btn" title="开启悬浮画中画（支持切到桌面悬浮播放）">
              📺 悬浮画中画
            </button>
            <span class="mode-badge" title="浏览器直连解码，无广告无中转">
              ⚡ 纯净秒播
            </span>
          </div>
        </div>

        <div class="player-main-grid">
          <!-- 视频播放器 -->
          <div class="player-art-box">
            <div id="artplayer"></div>
          </div>

          <!-- 右侧选源与选集控制台 -->
          <div class="player-controls-panel">
            <div class="panel-block">
              <div class="block-title">
                <span>📡 播放数据源</span>
                <span class="source-tip">卡顿一键换源</span>
              </div>
              <div class="source-selector" id="sourceSelector"></div>
            </div>

            <div class="panel-block">
              <div class="block-title">
                <span>🎞️ 直链线路</span>
              </div>
              <div class="line-selector" id="lineSelector"></div>
            </div>

            <div class="panel-block flex-1">
              <div class="block-title">
                <span>🔢 选集列表</span>
                <span id="episodesCount" class="count-badge"></span>
              </div>
              <div class="episodes-grid" id="episodesGrid"></div>
            </div>
          </div>
        </div>

        <!-- 影片简介信息 -->
        <div class="movie-meta-box" id="movieMetaBox">
          <h3 id="metaTitle"></h3>
          <div class="meta-tags" id="metaTags"></div>
          <p class="meta-desc" id="metaDesc"></p>
        </div>
      </div>
    </section>

    <!-- 列表展示区 -->
    <section class="catalog-section" id="catalogSection">
      <!-- 搜索结果区 -->
      <div id="searchResultsArea" style="display: none;">
        <div class="section-title-row">
          <h2 id="searchResultsTitle" class="section-title">搜索结果</h2>
        </div>
        <div class="cards-grid" id="searchResultsGrid"></div>
      </div>

      <!-- 推荐热播区 -->
      <div id="recommendArea">
        <div class="section-title-row">
          <h2 class="section-title">🌟 精选热门片源</h2>
          <span class="section-sub">直连超清 m3u8 秒播</span>
        </div>
        <div class="cards-grid" id="recommendGrid">
          <div class="loading-state">
            <div class="spinner"></div>
            <p>正在从聚合网络探测精选片源...</p>
          </div>
        </div>
      </div>
    </section>
  </main>

  <!-- 历史记录抽屉 -->
  <div class="drawer-overlay" id="historyOverlay" style="display: none;">
    <aside class="history-drawer">
      <div class="drawer-header">
        <h3>🕒 最近播放历史</h3>
        <button id="clearHistoryBtn" class="text-btn">清空历史</button>
        <button id="closeHistoryBtn" class="close-btn">✕</button>
      </div>
      <div class="drawer-content" id="historyList">
        <p class="empty-tip">暂无播放记录，快去搜一部喜欢的影片吧！</p>
      </div>
    </aside>
  </div>

  <footer class="app-footer">
    <p>Happy2movie 聚合播放器 Demo · 纯净直连 · 仅供技术验证交流</p>
  </footer>

  <script src="/app.js"></script>
</body>
</html>
